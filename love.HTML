<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Love Frames</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@400&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    overflow: hidden;
    height: 100vh;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: 'Poppins', sans-serif;
  }

  .container {
    position: relative;
    width: 100%;
    height: 100%;
  }

  /* 💖 FRAME */
  .frame {
    position: absolute;
    width: 65vw;
    height: 37vh;  /* 👈 reduced to stop touching */
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.18);
    border-radius: 16px;
    backdrop-filter: blur(8px);
    box-shadow: 0 0 15px rgba(255, 0, 80, 0.25);
    overflow: hidden;

    animation: floatUp 22s linear infinite; /* 👈 faster + better spacing */
  }

  /* 📸 IMAGE */
  .image-area {
    height: 70%;
    overflow: hidden;
  }

  .image-area img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 20%;
  }

  /* 💬 TEXT */
  .content {
    height: 30%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    text-align: center;
    padding: 6px;
  }

  .content span {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
  }

  .content small {
    font-size: 12px;
    opacity: 0.9;
  }

  /* 🚀 EXTRA DISTANCE = NO TOUCH */
  @keyframes floatUp {
    0% {
      transform: translate(-50%, 130vh); /* 👈 start lower */
      opacity: 0;
    }
    10% { opacity: 1; }
    85% { opacity: 1; }
    100% {
      transform: translate(-50%, -70vh); /* 👈 go higher */
      opacity: 0;
    }
  }

</style>
</head>

<body>

<div class="container">

  <!-- spacing = 22 / 5 = ~4.4s -->
  <div class="frame" style="animation-delay:0s;">
    <div class="image-area"><img src="1 (5).jpeg"></div>
    <div class="content"><span>My Love ❤️</span><small>I ❤️ U my love</small></div>
  </div>

  <div class="frame" style="animation-delay:4.4s;">
    <div class="image-area"><img src="1 (1).jpeg"></div>
    <div class="content"><span>Sweet Moment ❤️</span><small>You light up my life</small></div>
  </div>

  <div class="frame" style="animation-delay:8.8s;">
    <div class="image-area"><img src="1 (2).jpeg"></div>
    <div class="content"><span>Only You ❤️</span><small>My heartbeat ❤️</small></div>
  </div>

  <div class="frame" style="animation-delay:13.2s;">
    <div class="image-area"><img src="1 (3).jpeg"></div>
    <div class="content"><span>Be Mine ❤️</span><small>Always yours ❤️</small></div>
  </div>

  <div class="frame" style="animation-delay:17.6s;">
    <div class="image-area"><img src="1 (4).jpeg"></div>
    <div class="content"><span>Having You ❤️</span><small>My biggest blessing ❤️</small></div>
  </div>

</div>

</body>
</html>
