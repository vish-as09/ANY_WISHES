<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enter Love PIN 💘</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;
  }

  .container {
    padding: 20px;
    width: 90%;
    max-width: 350px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    color: white;
    font-size: clamp(24px, 6vw, 34px);
    margin-bottom: 20px;
  }

  p {
    color: white;
    opacity: 0.9;
    margin-bottom: 25px;
  }

  input {
    width: 100%;
    padding: 14px;
    border-radius: 25px;
    border: none;
    font-size: 18px;
    text-align: center;
    outline: none;
    margin-bottom: 20px;
  }

  button {
    width: 100%;
    padding: 14px;
    border-radius: 25px;
    border: none;
    background: #ff4d6d;
    color: white;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(255,0,80,0.6);
  }

  .error {
    color: white;
    margin-top: 10px;
    font-size: 14px;
    display: none;
  }

</style>
</head>

<body>

<div class="container">
  <h1>Enter Love PIN 💖</h1>
  <p>Only special people know this 😏</p>

  <input type="password" id="pin" placeholder="Enter PIN">

  <button onclick="checkPin()">Unlock 💘</button>

  <div class="error" id="error">Wrong PIN... try again[123456] 🥺</div>
</div>

<script>
  const tickAudioContext = new (window.AudioContext || window.webkitAudioContext)();

  function playTick() {
    const osc = tickAudioContext.createOscillator();
    const gain = tickAudioContext.createGain();
    osc.type = 'square';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, tickAudioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, tickAudioContext.currentTime + 0.06);
    osc.connect(gain);
    gain.connect(tickAudioContext.destination);
    osc.start();
    osc.stop(tickAudioContext.currentTime + 0.06);
  }

  const pinInput = document.getElementById('pin');
  pinInput.addEventListener('keydown', () => {
    if (tickAudioContext.state === 'suspended') {
      tickAudioContext.resume();
    }
    playTick();
  });

  function checkPin() {
    const pin = pinInput.value;
    const error = document.getElementById('error');

    if (pin === '123456') {
      window.location.href = 'love.HTML';
    } else {
      error.style.display = 'block';
      playTick();
    }
  }
</script>

</body>
</html>
