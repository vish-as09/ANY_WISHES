<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: 'Poppins', sans-serif;
    cursor: pointer;
  }

  /* 🔹 Background layer */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  .heart, .light {
    position: absolute;
    pointer-events: none;
  }

  /* 💥 Heart blast */
  .heart {
    font-size: 20px;
    animation: explode 2s ease-out forwards;
  }

  @keyframes explode {
    0% {
      transform: translate(50vw, 50vh) scale(0.5);
      opacity: 1;
    }
    100% {
      transform: translate(var(--x), var(--y)) scale(1.5);
      opacity: 0;
    }
  }

  /* ✨ Lights */
  .light {
    width: 6px;
    height: 6px;
    background: white;
    border-radius: 50%;
    animation: twinkle 2s infinite;
  }

  @keyframes twinkle {
    0%,100% { opacity: 0; }
    50% { opacity: 1; }
  }

  /* 💖 Message */
  .message {
    position: relative;
    z-index: 10;
    text-align: center;
    top: 20%;
    color: white;
    opacity: 0;
    transition: opacity 1.5s ease;
  }

  .message h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 8vw, 50px);
  }

  .tap-hint {
    margin: 20px auto 0;
    width: 64px;
    height: 64px;
    opacity: 0.95;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tap-hint svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .show {
    opacity: 1;
  }

  .audio-button {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    width: 48px;
    height: 48px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,0.26);
    color: #222;
    backdrop-filter: blur(14px);
    cursor: pointer;
    box-shadow: 0 14px 30px rgba(0,0,0,0.16);
    display: none;
    align-items: center;
    justify-content: center;
  }
  .audio-button svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
  }

</style>
</head>

<body onclick="goNext()">

<!-- 🔹 Background -->
<div class="bg" id="bg"></div>

<audio id="birthday-audio" src="happy_birthday.mp3" loop preload="auto" autoplay></audio>
<button id="audio-toggle" class="audio-button" type="button" aria-label="Pause music">
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M6 5h4v14H6zm8 0h4v14h-4z" />
  </svg>
</button>

<!-- 💖 Message -->
<div class="message" id="msg">
  <h1>Happiest Birthday</h1>
  <h1>Mera Bachhru</h1>
  <h3>[love note eg: Mera pyara bacha mera babu mera shona meri machri meri chugiya meri puchki meri shuggi hamar jaan hamar patarki hamaar praan my sweety my cutiepie my pookie my husband my hubby my honey my everthing]</h3>

  <div class="tap-hint" aria-label="Gift">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path fill="#fff" d="M52 28H34V18.68c0-3.16 2.56-5.72 5.72-5.72 1.63 0 3.13.68 4.2 1.76l2.11 2.1 2.12-2.1A6.435 6.435 0 0 1 48.28 13C51.44 13 54 15.56 54 18.72V28z" opacity="0.9"/>
      <path fill="#fff" d="M32 28H12V18.72C12 15.56 14.56 13 17.72 13c1.63 0 3.13.68 4.2 1.76l2.11 2.1 2.12-2.1A6.435 6.435 0 0 1 33.28 13C36.44 13 39 15.56 39 18.72V28z" opacity="0.9"/>
      <path fill="#fff" d="M54 32v22c0 3.31-2.69 6-6 6H16c-3.31 0-6-2.69-6-6V32h44z" opacity="0.85"/>
      <path fill="#ff7bb7" d="M18 32h28v22H18z"/>
      <path fill="#fff" d="M18 40h28v6H18zm0 10h28v4H18z" opacity="0.55"/>
    </svg>
  </div>
</div>

<script>
  const bg = document.getElementById("bg");
  const hearts = ["❤️","💖","💕","💘"];

  let canClick = false; // control when tap works

  function heartBlast() {
    for (let i = 0; i < 80; i++) {
      const h = document.createElement("div");
      h.className = "heart";
      h.innerHTML = hearts[Math.floor(Math.random()*hearts.length)];

      const x = (Math.random() - 0.5) * 100 + "vw";
      const y = (Math.random() - 0.5) * 100 + "vh";

      h.style.setProperty('--x', x);
      h.style.setProperty('--y', y);

      bg.appendChild(h);

      setTimeout(() => h.remove(), 2000);
    }
  }

  function createLights() {
    for (let i = 0; i < 120; i++) {
      const light = document.createElement("div");
      light.className = "light";

      light.style.left = Math.random()*100 + "vw";
      light.style.top = Math.random()*100 + "vh";

      bg.appendChild(light);
    }
  }

  function goNext() {
    if (canClick) {
      window.location.href = "pin.html";
    }
  }

  // 🎬 Sequence
  heartBlast();

  setTimeout(() => {
    createLights();
  }, 2500);

  setTimeout(() => {
    document.getElementById("msg").classList.add("show");
  }, 5000);

  setTimeout(() => {
    canClick = true; // allow click AFTER message
  }, 6000);

  const birthdayAudio = document.getElementById('birthday-audio');
  const audioToggle = document.getElementById('audio-toggle');

  function updateAudioButton() {
    if (!birthdayAudio || !audioToggle) return;
    if (birthdayAudio.paused) {
      audioToggle.innerHTML = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M8 5v14l11-7z"/></svg>';
      audioToggle.setAttribute('aria-label', 'Play music');
    } else {
      audioToggle.innerHTML = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';
      audioToggle.setAttribute('aria-label', 'Pause music');
    }
  }

  if (birthdayAudio) {
    birthdayAudio.load();
  }

  if (audioToggle && birthdayAudio) {
    audioToggle.addEventListener('click', async (event) => {
      event.stopPropagation();
      if (birthdayAudio.paused) {
        try {
          await birthdayAudio.play();
        } catch (err) {
          // autoplay was blocked; still keep button visible
        }
      } else {
        birthdayAudio.pause();
      }
      updateAudioButton();
    });

    async function tryAutoplay() {
      try {
        await birthdayAudio.play();
        audioToggle.style.display = 'none';
      } catch (err) {
        audioToggle.style.display = 'inline-flex';
        updateAudioButton();
      }
    }

    async function tryUserGesture() {
      if (!birthdayAudio.paused) return;
      try {
        await birthdayAudio.play();
        audioToggle.style.display = 'none';
      } catch (err) {
        audioToggle.style.display = 'inline-flex';
        updateAudioButton();
      }
    }

    window.addEventListener('load', tryAutoplay);
    document.addEventListener('click', tryUserGesture, { once: true });
  }

</script>

</body>
</html>
