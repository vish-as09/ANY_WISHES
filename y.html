<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Please Say Yes 🥺</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;
  }

  .container {
    padding: 20px;
  }

  /* 🥺 Big soft emoji */
  .emoji {
    font-size: clamp(90px, 30vw, 160px);
    margin-bottom: 20px;
    animation: float 2s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(22px, 6vw, 32px);
    color: white;
    margin-bottom: 10px;
  }

  p {
    color: white;
    font-size: clamp(14px, 4vw, 18px);
    opacity: 0.9;
    margin-bottom: 30px;
  }

  .yes-btn {
    padding: 14px 30px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    background: #ff4d6d;
    color: white;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(255,0,80,0.6);
    transition: transform 0.2s ease;
  }

  .yes-btn:active {
    transform: scale(1.1);
  }

</style>
</head>

<body>

<div class="container">
  <div class="emoji">🥺</div>

  <h1>Haa Kahda...</h1>
  <p>Mujhe heart ho rha bigboss 💖</p>

  <button class="yes-btn" onclick="goBack()">YES 💘</button>
</div>

<script>
  function goBack() {
    window.location.href = "hba.html"; // your main page
  }
</script>

</body>
</html>
